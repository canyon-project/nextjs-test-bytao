# 仅构建 next-swc 多平台 native，合并后的 .node 作为 workflow 产物上报，不发布 npm
# 手动触发；不构建 next、不部署
name: Build next-swc native (bytao)

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ format('{0}-sha-{1}', github.workflow, github.sha) }}
  cancel-in-progress: true

env:
  NODE_LTS_VERSION: 20
  NEXT_SKIP_NATIVE_POSTINSTALL: 1

jobs:
  build-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_LTS_VERSION }}
          check-latest: true

      - name: Setup corepack
        run: |
          npm i -g corepack@0.31
          corepack enable

      - name: Install Rust
        uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        name: Cache pnpm store
        with:
          path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
          key: pnpm-store-swc-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Clear native dir
        run: rm -rf packages/next-swc/native
        if: runner.os != 'Windows'

      - name: Clear native dir (Windows)
        run: if (Test-Path packages/next-swc/native) { Remove-Item -Recurse -Force packages/next-swc/native }
        if: runner.os == 'Windows'

      - name: Build native (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cd packages/next-swc
          npm run build-native-release -- --target ${{ matrix.target }}
        env:
          CARGO_TERM_COLOR: always

      - name: Build native (Windows)
        if: runner.os == 'Windows'
        run: |
          cd packages/next-swc
          npm run build-native-release -- --target ${{ matrix.target }}
        env:
          CARGO_TERM_COLOR: always

      - name: Upload next-swc native artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-swc-native-${{ matrix.target }}
          path: packages/next-swc/native/*.node

  merge-and-upload:
    name: Merge and upload .node artifacts
    runs-on: ubuntu-latest
    needs: build-native
    permissions:
      contents: read
    steps:
      - name: Download all native artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: next-swc-native-*
          merge-multiple: true
          path: packages/next-swc/native

      - name: List merged native binaries
        run: ls -la packages/next-swc/native

      - name: Upload merged next-swc .node artifacts
        uses: actions/upload-artifact@v4
        with:
          name: next-swc-native-all
          path: packages/next-swc/native/*.node
