# 仅构建 next-swc 多平台 native 并以其名义发布到 npm（如 @canyon-project/swc）
# 手动触发；不构建 next、不部署
name: Publish next-swc (bytao)

on:
  workflow_dispatch:

concurrency:
  group: ${{ format('{0}-sha-{1}', github.workflow, github.sha) }}
  cancel-in-progress: true

env:
  NODE_LTS_VERSION: 20
  NEXT_SKIP_NATIVE_POSTINSTALL: 1

jobs:
  build-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: macos-latest
            target: aarch64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_LTS_VERSION }}
          check-latest: true

      - name: Setup corepack
        run: |
          npm i -g corepack@0.31
          corepack enable

      - name: Install Rust
        uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        name: Cache pnpm store
        with:
          path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
          key: pnpm-store-swc-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Clear native dir
        run: rm -rf packages/next-swc/native
        if: runner.os != 'Windows'

      - name: Clear native dir (Windows)
        run: if (Test-Path packages/next-swc/native) { Remove-Item -Recurse -Force packages/next-swc/native }
        if: runner.os == 'Windows'

      - name: Build native (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cd packages/next-swc
          npm run build-native-release -- --target ${{ matrix.target }}
        env:
          CARGO_TERM_COLOR: always

      - name: Build native (Windows)
        if: runner.os == 'Windows'
        run: |
          cd packages/next-swc
          npm run build-native-release -- --target ${{ matrix.target }}
        env:
          CARGO_TERM_COLOR: always

      - name: Upload next-swc native artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-swc-native-${{ matrix.target }}
          path: packages/next-swc/native/*.node

  publish-next-swc-bytao:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: build-native
    permissions:
      contents: read
      id-token: write
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      NPM_PACKAGE_NAME: '@canyon-project/swc'
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_LTS_VERSION }}
          check-latest: true

      - name: Setup corepack
        run: |
          npm i -g corepack@0.31
          corepack enable

      - uses: actions/checkout@v4
        with:
          fetch-depth: 25

      - name: Tune Linux network
        run: sudo ethtool -K eth0 tx off rx off

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        name: Cache pnpm store
        with:
          path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
          key: pnpm-store-swc-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download all native artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: next-swc-native-*
          merge-multiple: true
          path: packages/next-swc/native

      - name: List native binaries
        run: ls -la packages/next-swc/native

      - name: Configure npm auth
        run: echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" >> ~/.npmrc

      - name: Publish @next/swc to npm
        run: node ./scripts/publish-next-swc-bytao.js
        env:
          NPM_PACKAGE_NAME: ${{ env.NPM_PACKAGE_NAME }}
          NPM_PUBLISH_TAG: canary
